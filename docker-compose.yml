services:
  # Backend service for deployment/demo mode
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demo-agent-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Shanghai
      - SQLITE_PATH=/app/data/app.db
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./backend/data:/app/data
    networks:
      - agent-network

  # Frontend service for deployment/demo mode
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demo-agent-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
