version: '3.8'

services:
  # ==========================================
  # 后端服务: FastAPI Agent
  # ==========================================
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: demo-agent-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Shanghai
      - SQLITE_PATH=/app/data/app.db
    ports:
      - "8000:8000"
    volumes:
      # 将 skills 挂载出来，方便在宿主机随时实时修改 MD 文件并热加载
      - ./backend/skills:/app/skills
      # 将 prompts 挂载出来，方便在宿主机随时实时修改提示词并热加载
      - ./backend/prompts:/app/prompts
      # 将 SQLite 数据文件挂载到宿主机，便于持久化保存
      - ./backend/data:/app/data
    networks:
      - agent-network

  # ==========================================
  # 前端服务: Vue 3 + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demo-agent-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - agent-network
    # 如果 frontend 镜像构建时需要 API 地址的环境变量，可通过 args 注入，并在 Dockerfile 处理。
    # 这里通过 Nginx 运行，对于前端环境变量的控制如果写死在打包静态文件里，建议在宿主机先打好包。

networks:
  agent-network:
    driver: bridge
